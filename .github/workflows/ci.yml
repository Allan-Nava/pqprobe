name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - name: Test with coverage
        run: |
          go test -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -1

      # The probe fans out over endpoints and folds the results back into one
      # slice. That is worth the race detector on every run.
      - name: Test with the race detector
        run: go test -race ./...

      - run: go build ./...

      # No dependencies is a property worth defending: it is why the binary is
      # static, small and auditable. A stray require would end that quietly.
      - name: Still zero dependencies
        run: |
          if [ -f go.sum ] && [ -s go.sum ]; then
            echo "::error::go.sum is non-empty — pqprobe is meant to have no dependencies"
            cat go.sum
            exit 1
          fi
          if grep -qE '^\s*(require|replace)\b' go.mod; then
            echo "::error::go.mod declares requirements — pqprobe is meant to have no dependencies"
            cat go.mod
            exit 1
          fi

      # pqprobe opens TLS connections and sends nothing. An import of net/http
      # would make it possible to send a request by accident, and os/exec has no
      # business in a tool people point at production: both are build failures
      # rather than review comments.
      - name: No requests, no subprocesses
        run: |
          if grep -rnE '"(net/http|os/exec)"' cmd internal --include='*.go' | grep -v '_test.go'; then
            echo "::error::pqprobe handshakes and closes; it must not speak HTTP or run programs"
            exit 1
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The site is one committed static file that nothing builds, so a link
      # that stops resolving would otherwise be found by a reader.
      - name: No dead links in the documentation
        run: ./scripts/docs.sh check
      - name: The link gate itself
        run: sh scripts/docs_test.sh
      # An edited SVG with a stale PNG is the failure nobody sees: the page looks
      # right and the social card is last month's.
      - name: The PNGs are in step with their SVGs
        run: sh scripts/render-assets.sh --check
      - name: The freshness gate itself
        run: sh scripts/assets_test.sh
      # The About box is data here, and a description GitHub would reject is a
      # silently ignored API call rather than an error.
      - name: The repository metadata is valid
        run: ./scripts/repo-meta.sh lint
      - name: The metadata gate itself
        run: sh scripts/repo-meta_test.sh
      # Everything a search result is built from fails silently: a canonical
      # that drifted, a sitemap naming an old URL, JSON-LD truncated by an edit.
      - name: The site's SEO files agree with the page
        run: sh scripts/seo.sh check
      - name: The SEO gate itself
        run: sh scripts/seo_test.sh

  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The notes in every GitHub release come out of CHANGELOG.md by script, so
      # the extractor is tested rather than eyeballed at tag time.
      - name: The release notes extractor and the release script's refusals
        run: sh scripts/release_test.sh
      - name: The newest CHANGELOG section is extractable
        run: ./scripts/release-notes.sh >/dev/null
      - name: The version gate itself
        run: sh scripts/version_test.sh
      # A stale formula is worse than a missing one: `brew install` reads
      # whatever it says, so one left at the previous version installs the old
      # binary and looks like it worked.
      - name: The Homebrew formula names the current version
        run: ./scripts/brew.sh check
      - name: The formula generator itself
        run: sh scripts/brew_test.sh

  # Every commit ships as a tagged vX.Y.Z with its own CHANGELOG section. On a
  # tag that is a hard requirement; on a branch push the tag is usually a second
  # push away, so a missing one is a warning and only a *contradicting* tag
  # fails. Needs the tags, hence fetch-depth: 0.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: HEAD is the version the CHANGELOG names
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ./scripts/version.sh check
          else
            ./scripts/version.sh check --warn
          fi

  # PQ-27: the action is delivery, so it is tested the way it will be used —
  # and validated first, because actionlint reads workflows, not action
  # metadata, and the first version of this file failed to load entirely.
  # `uses: ./` against this very commit. `version: ${{ github.sha }}` is
  # fetchable by definition here, since CI only runs on commits GitHub has.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: action.yml is valid, with no expression inside a run block
        run: sh scripts/action.sh check
      - name: The action gate itself
        run: sh scripts/action_test.sh
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - id: run
        uses: ./
        with:
          targets: example.com
          args: --timeout 15s
          version: ${{ github.sha }}
          exit-on: ""
      - name: The action produced findings
        env:
          FINDINGS: ${{ steps.run.outputs.findings }}
        run: |
          echo "$FINDINGS" | head -20
          # An empty array is a valid answer; nothing at all is a broken action.
          echo "$FINDINGS" | grep -q '\[' || { echo "::error::the action emitted no findings array"; exit 1; }

  backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the backlog
        run: ./scripts/backlog.sh lint
      - name: ROADMAP.md is in sync with BACKLOG.md
        run: ./scripts/backlog.sh check
      - name: The roadmap generator and the linter
        run: sh scripts/backlog_test.sh
      - name: The issue planner
        run: sh scripts/backlog_issues_test.sh

  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - run: actionlint .github/workflows/*.yml

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/pqprobe

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and probe a public endpoint with it
        run: |
          docker build -t pqprobe:test --build-arg VERSION=ci-${{ github.sha }} .
          docker run --rm pqprobe:test probe example.com --timeout 15s
