name: Pages

# PQ-17: publishes docs/ to GitHub Pages. The site is a single committed static
# file with no build step and no external request, so there is nothing to
# install here — the job uploads the directory as it is committed.
#
# Requires Settings → Pages → Source = "GitHub Actions" on the repository.

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a push during a
# deploy queues rather than leaving the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The same gate CI runs: never publish a site with a dead link in it.
      - name: The documentation links resolve
        run: ./scripts/docs.sh check

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
