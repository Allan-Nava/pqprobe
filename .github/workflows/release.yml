name: Release

# PQ-16. A tag is the only trigger, and everything a release consists of is
# built from that tag: archives for six platforms, one SHA256SUMS, a provenance
# attestation, the ghcr.io image, and release notes lifted from the CHANGELOG
# section rather than retyped.
#
# goreleaser builds the archives, the checksums, the GitHub release and the
# **Homebrew cask** — the last one being why it is here at all: a cask hands a
# user a prebuilt binary, where the previous in-repo formula asked everybody to
# install Go and compile. PQ-16 originally avoided goreleaser on the grounds
# that a pipeline with no dependencies suits a binary with none; that argument
# was about the binary, and the binary is untouched — nothing goreleaser does
# enters go.mod, and the gate that checks that still runs above.
#
# The release notes come from CHANGELOG.md rather than from commit subjects.
# `scripts/release.sh` prepares the tag locally; pushing it is the maintainer's
# decision and this is what happens next.
#
# Every job checks out the **tag**, not the branch, so a release is built from
# exactly what was tagged. The consequence: this pipeline can only publish tags
# whose tree already contains it — v0.1.0 predates it and is not re-publishable
# from here, which is why the dispatch input asks for an existing tag rather
# than offering to make one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to (re)publish, e.g. v0.2.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # A tag that fails a gate must not become a release. Everything here also runs
  # on every push, so this job is the assertion that the tag is not special.
  gates:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.notes.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: gofmt, vet, tests
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd: $unformatted"; exit 1
          fi
          go vet ./...
          go test -race ./...

      - name: The project's own gates
        run: |
          ./scripts/backlog.sh lint
          ./scripts/backlog.sh check
          ./scripts/docs.sh check
          ./scripts/repo-meta.sh lint
          sh scripts/render-assets.sh --check
          sh scripts/backlog_test.sh
          sh scripts/docs_test.sh
          sh scripts/release_test.sh
          sh scripts/repo-meta_test.sh
          sh scripts/assets_test.sh
          sh scripts/version_test.sh
          sh scripts/goreleaser_test.sh
          ./scripts/goreleaser.sh check
          ./scripts/version.sh check
          sh scripts/seo.sh check
          sh scripts/seo_test.sh
          sh scripts/action.sh check
          sh scripts/action_test.sh

      # The notes are the CHANGELOG section for this version. No section means no
      # release: an empty release body is worse than a failed workflow, because
      # nobody notices it until they are trying to work out what changed.
      - id: notes
        name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ./scripts/release-notes.sh "$version" > notes.md
          echo "### Release notes for $version" >> "$GITHUB_STEP_SUMMARY"
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  goreleaser:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The attestation is what ties an archive to this workflow and this tag
      # without anybody holding a signing key.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # The notes are the CHANGELOG section, not a list of commit subjects:
      # goreleaser's own changelog is disabled in the config for that reason.
      - name: Release notes from CHANGELOG.md
        run: ./scripts/release-notes.sh "${TAG#v}" > /tmp/notes.md

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=/tmp/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A fine-grained PAT that may write to Allan-Nava/homebrew-tap, which
          # this workflow's GITHUB_TOKEN cannot. Without it the release still
          # publishes its archives and the cask step fails — the artefacts are
          # fine, the tap is stale, and `brew install` keeps handing out the
          # previous version.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/pqprobe_*

  image:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is tagged with the version *without* the leading v, and with
      # latest. Two tags, no floating major: a probe people point at production
      # should be pinned deliberately.
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.gates.outputs.version }}
          tags: |
            ghcr.io/allan-nava/pqprobe:${{ needs.gates.outputs.version }}
            ghcr.io/allan-nava/pqprobe:latest

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/allan-nava/pqprobe
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # The published image answers the same way the one CI builds does, or the
      # release ships an image nobody ran.
      - name: Smoke-test the published image
        run: |
          image="ghcr.io/allan-nava/pqprobe:${{ needs.gates.outputs.version }}"
          docker run --rm "$image" version
          docker run --rm "$image" probe example.com --timeout 15s
