name: Release

# PQ-16. A tag is the only trigger, and everything a release consists of is
# built from that tag: archives for six platforms, one SHA256SUMS, a provenance
# attestation, the ghcr.io image, and release notes lifted from the CHANGELOG
# section rather than retyped.
#
# No goreleaser, no release-please, no action that needs a config file of its
# own: this repository builds a static binary out of the standard library, and
# its release pipeline has no dependencies either. `scripts/release.sh` prepares
# the tag locally; pushing it is the maintainer's decision and this is what
# happens next.
#
# Every job checks out the **tag**, not the branch, so a release is built from
# exactly what was tagged. The consequence: this pipeline can only publish tags
# whose tree already contains it — v0.1.0 predates it and is not re-publishable
# from here, which is why the dispatch input asks for an existing tag rather
# than offering to make one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to (re)publish, e.g. v0.2.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # A tag that fails a gate must not become a release. Everything here also runs
  # on every push, so this job is the assertion that the tag is not special.
  gates:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.notes.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: gofmt, vet, tests
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd: $unformatted"; exit 1
          fi
          go vet ./...
          go test -race ./...

      - name: The project's own gates
        run: |
          ./scripts/backlog.sh lint
          ./scripts/backlog.sh check
          ./scripts/docs.sh check
          ./scripts/repo-meta.sh lint
          sh scripts/render-assets.sh --check
          sh scripts/backlog_test.sh
          sh scripts/docs_test.sh
          sh scripts/release_test.sh
          sh scripts/repo-meta_test.sh
          sh scripts/assets_test.sh
          sh scripts/version_test.sh
          sh scripts/brew_test.sh
          ./scripts/brew.sh check
          ./scripts/version.sh check
          sh scripts/seo.sh check
          sh scripts/seo_test.sh
          sh scripts/action.sh check
          sh scripts/action_test.sh

      # The notes are the CHANGELOG section for this version. No section means no
      # release: an empty release body is worse than a failed workflow, because
      # nobody notices it until they are trying to work out what changed.
      - id: notes
        name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ./scripts/release-notes.sh "$version" > notes.md
          echo "### Release notes for $version" >> "$GITHUB_STEP_SUMMARY"
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  archives:
    needs: gates
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # CGO off and -trimpath: the binary has to be static and its paths have to
      # be reproducible, or "one static binary, no dependencies" is only true on
      # the machine that built it.
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${TAG#v}"
          name="pqprobe_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          bin=pqprobe
          [ "$GOOS" = windows ] && bin=pqprobe.exe
          go build -trimpath -ldflags "-s -w -X main.version=$version" \
            -o "dist/$name/$bin" ./cmd/pqprobe
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then zip -qr "$name.zip" "$name"
          else tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [gates, archives]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The attestation is what makes an archive traceable to this workflow and
      # this tag without anybody holding a signing key.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: .

      # One file, sorted, with plain names — so `sha256sum -c SHA256SUMS` works
      # in the directory somebody downloaded into.
      - name: SHA256SUMS
        run: |
          cd dist
          # Named by prefix rather than by *: the sums file must not list itself,
          # and a glob would depend on when the redirect creates it.
          sha256sum -- pqprobe_* | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/pqprobe_*

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" dist/* \
            --title "pqprobe ${TAG#v}" \
            --notes-file notes.md \
            --verify-tag

  image:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is tagged with the version *without* the leading v, and with
      # latest. Two tags, no floating major: a probe people point at production
      # should be pinned deliberately.
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.gates.outputs.version }}
          tags: |
            ghcr.io/allan-nava/pqprobe:${{ needs.gates.outputs.version }}
            ghcr.io/allan-nava/pqprobe:latest

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/allan-nava/pqprobe
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # The published image answers the same way the one CI builds does, or the
      # release ships an image nobody ran.
      - name: Smoke-test the published image
        run: |
          image="ghcr.io/allan-nava/pqprobe:${{ needs.gates.outputs.version }}"
          docker run --rm "$image" version
          docker run --rm "$image" probe example.com --timeout 15s
