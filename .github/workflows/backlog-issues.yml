name: Backlog issues

# Keep the GitHub issues in step with BACKLOG.md.
#
# BACKLOG.md is the single source of truth, the same way it already is for
# ROADMAP.md: an item's stable PQ-n id is what commits and the CHANGELOG
# reference, and the issue is a view of it. So the sync runs one way only —
# backlog to issues, never the reverse. Editing an issue title or closing it on
# GitHub does not change the plan; ticking the item in BACKLOG.md does.
#
# It runs only when the backlog or its tooling changes, because nothing else can
# alter the plan, and on demand so the first run can be done deliberately.
#
# The dispatch input reaches the shell through the environment, never through
# `${{ }}` inside a `run:` block. Only somebody who can already dispatch a
# workflow can set it, but this job holds a token that can write issues, and
# "the person who could abuse it is trusted" is not a reason to paste a string
# straight into a command line. It is also validated before use: a milestone
# filter is `M` and digits, comma-separated, and nothing else.

on:
  push:
    branches: ["main"]
    paths:
      - "BACKLOG.md"
      - "scripts/backlog.sh"
      - ".github/workflows/backlog-issues.yml"
  workflow_dispatch:
    inputs:
      milestones:
        description: "Limit to these milestones, comma-separated (e.g. M2,M5). Empty means all."
        required: false
        default: ""
      dry_run:
        description: "Print the plan without changing anything"
        type: boolean
        required: false
        default: false

# Opening and closing issues needs this; nothing here writes to the repository.
permissions:
  contents: read
  issues: write

concurrency:
  # Two runs racing would both see "no issue for PQ-n" and open it twice.
  group: backlog-issues
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The backlog parses before anything is synced
        run: ./scripts/backlog.sh lint

      # The plan is printed before anything is applied, so the log says what the
      # run was about to do even if a later step fails.
      - name: Plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MILESTONES: ${{ inputs.milestones }}
        run: |
          if [ -n "${MILESTONES:-}" ]; then
            case "$MILESTONES" in
              M[0-9]*) ;;
              *) echo "::error::milestones must look like M2 or M2,M5"; exit 1 ;;
            esac
            case "$MILESTONES" in
              *[!M0-9,]*) echo "::error::milestones must look like M2 or M2,M5"; exit 1 ;;
            esac
            set -- --milestones "$MILESTONES"
          else
            set --
          fi
          ./scripts/backlog.sh issues "$@" | tee "$RUNNER_TEMP/plan.txt"
          {
            echo "### Backlog issue sync — plan"
            echo '```'
            tail -3 "$RUNNER_TEMP/plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MILESTONES: ${{ inputs.milestones }}
        run: |
          if [ -n "${MILESTONES:-}" ]; then
            set -- --milestones "$MILESTONES"
          else
            set --
          fi
          ./scripts/backlog.sh issues --apply "$@"
