name: Brew

# PQ-41, then PQ-42. It began as a check on an in-repo formula that built from
# source; the formula is gone and a **cask** takes its place — goreleaser
# generates it on every tag and pushes it to Allan-Nava/homebrew-tap, so
# `brew install --cask` hands over a prebuilt binary instead of asking for Go
# and a compile.
#
# What this workflow is for stays the same: our own gates can only compare the
# config against itself, and the only authority on whether `brew install` works
# is `brew install`. It runs what a user types.
#
# Three lessons are encoded here rather than rediscovered:
#
#   * Homebrew 6+ ignores third-party taps unless they are trusted, and a
#     headless run then quietly installs nothing. HOMEBREW_NO_REQUIRE_TAP_TRUST
#     is what makes it work unattended — found by running it by hand.
#   * `macos-13` was retired. A job asking for a label with no runners behind it
#     does not fail — it **queues forever**, so the workflow never concludes and
#     verifies nothing (checkfleet paid a day for that one). The Intel leg is
#     `macos-15-intel`.

on:
  # After a release, so the formula the tag carries is the one exercised.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # On a change to the formula or its generator. The install is skipped there:
  # the formula clones its tag from GitHub, and on a pull request that tag does
  # not exist yet — style and audit are the parts that can run.
  pull_request:
    paths:
      # The cask is generated from these, so a change to either is what this
      # workflow exists to catch. (They replaced Formula/** and scripts/brew.sh
      # in 0.27.0; leaving the old paths here would have meant the workflow
      # never ran again.)
      - ".goreleaser.yaml"
      - "scripts/goreleaser.sh"
      - ".github/workflows/brew.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to assert without the leading v (e.g. 0.25.1); empty = just check it is a real version"
        required: false
        default: ""
  # Weekly, because a tap rots on its own: a deleted tag, a Go version that
  # stops building, a Homebrew policy change.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  formula:
    # For the release trigger, only when the release actually succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel] # arm64, intel
    runs-on: ${{ matrix.os }}
    # A guard, not an optimisation: building from source takes a couple of
    # minutes, so anything near this is a hang and should say so.
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      # Homebrew 6+ asks to trust third-party taps; without this a headless run
      # ignores the tap and proves nothing.
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - uses: actions/checkout@v4

      # The config that generates the cask is the only part of it visible from
      # a checkout; the cask itself lives in the tap.
      - name: The release config and the cask it publishes
        run: ./scripts/goreleaser.sh check

      - name: The release config's own tests
        run: sh scripts/goreleaser_test.sh

      # What a user actually types. On a pull request the tap still holds the
      # previous release, so this is skipped there: it would verify the old cask
      # and say nothing about the change under review.
      - name: brew install --cask
        if: ${{ github.event_name != 'pull_request' }}
        run: brew install --cask Allan-Nava/tap/pqprobe

      - name: It runs, and reports a real version
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          which pqprobe
          pqprobe version
          short="$(pqprobe version --short)"
          echo "$short"
          # Never the local 'dev' string: a released cask carries a real version.
          echo "$short" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "::error::unexpected version output: $short"; exit 1; }

      - name: Assert an exact version (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        run: pqprobe version --short | grep -qx "${{ inputs.version }}"

      # The binary is unsigned, so the cask strips the quarantine attribute in a
      # postflight hook. If that ever stops working the install succeeds and the
      # binary does not run — which is worse than a failed install.
      - name: Gatekeeper quarantine attribute is stripped
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          bin="$(readlink -f "$(which pqprobe)")"
          if xattr -l "$bin" 2>/dev/null | grep -qi com.apple.quarantine; then
            echo "::error::$bin still has com.apple.quarantine — the postflight hook failed"
            exit 1
          fi
          echo "no quarantine attribute"

      # The install is not the point; the tool working is.
      - name: Smoke — it probes a real endpoint
        if: ${{ github.event_name != 'pull_request' }}
        run: pqprobe probe example.com --timeout 20s
