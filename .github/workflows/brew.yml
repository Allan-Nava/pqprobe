name: Brew

# PQ-41. Until this existed, `Formula/pqprobe.rb` was only ever checked by the
# script that writes it — `scripts/brew.sh check` compares the file against its
# own renderer, which cannot notice that Homebrew disagrees. It did: running
# `brew audit` by hand found "Stable: `version 0.25.1` is redundant with version
# scanned from URL", an error that would have reached anybody tapping this repo.
#
# So this workflow is the half our gates cannot be: Homebrew's own opinion, and
# an install that actually happens.
#
# Three lessons are encoded here rather than rediscovered:
#
#   * `brew install ./Formula/pqprobe.rb` is **disabled** in current Homebrew.
#     The supported route is to tap and install by qualified name, which is also
#     what a user does.
#   * Homebrew 6+ ignores third-party taps unless they are trusted, and a
#     headless run then quietly installs nothing. HOMEBREW_NO_REQUIRE_TAP_TRUST
#     is what makes it work unattended.
#   * `macos-13` was retired. A job asking for a label with no runners behind it
#     does not fail — it **queues forever**, so the workflow never concludes and
#     verifies nothing (checkfleet paid a day for that one). The Intel leg is
#     `macos-15-intel`.

on:
  # After a release, so the formula the tag carries is the one exercised.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # On a change to the formula or its generator. The install is skipped there:
  # the formula clones its tag from GitHub, and on a pull request that tag does
  # not exist yet — style and audit are the parts that can run.
  pull_request:
    paths:
      - "Formula/**"
      - "scripts/brew.sh"
      - ".github/workflows/brew.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to assert without the leading v (e.g. 0.25.1); empty = just check it is a real version"
        required: false
        default: ""
  # Weekly, because a tap rots on its own: a deleted tag, a Go version that
  # stops building, a Homebrew policy change.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  formula:
    # For the release trigger, only when the release actually succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel] # arm64, intel
    runs-on: ${{ matrix.os }}
    # A guard, not an optimisation: building from source takes a couple of
    # minutes, so anything near this is a hang and should say so.
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      # Homebrew 6+ asks to trust third-party taps; without this a headless run
      # ignores the tap and proves nothing.
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - uses: actions/checkout@v4

      # Our own gate first: it is instant, and if the formula does not name the
      # version the CHANGELOG does, nothing below is worth running.
      - name: The formula names the current version
        run: ./scripts/brew.sh check

      - name: The formula generator's own tests
        run: sh scripts/brew_test.sh

      # Tapping the checkout is how the formula under test gets a qualified
      # name. It is a git clone, so an uncommitted formula is invisible here —
      # which is a feature: what is tested is what is committed.
      - name: Tap this checkout
        run: |
          brew untap allan-nava/pqprobe 2>/dev/null || true
          brew tap allan-nava/pqprobe "$GITHUB_WORKSPACE"
          brew tap-info allan-nava/pqprobe

      - name: brew style
        run: brew style allan-nava/pqprobe/pqprobe

      # Homebrew's own opinion, which is the thing our renderer cannot have.
      - name: brew audit
        run: brew audit --formula allan-nava/pqprobe/pqprobe

      # The formula clones its tag from GitHub, so this only makes sense once
      # that tag exists — after a release, on a schedule, or on demand.
      - name: brew install --build-from-source
        if: ${{ github.event_name != 'pull_request' }}
        run: brew install --build-from-source allan-nava/pqprobe/pqprobe

      - name: It runs, and reports a real version
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          which pqprobe
          pqprobe version
          short="$(pqprobe version --short)"
          echo "$short"
          # Never the local 'dev' string: a formula build carries a real version.
          echo "$short" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "::error::unexpected version output: $short"; exit 1; }
          expected="$(./scripts/version.sh current)"
          [ "$short" = "$expected" ] \
            || { echo "::error::installed $short but the CHANGELOG says $expected"; exit 1; }

      - name: Assert an exact version (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        run: pqprobe version --short | grep -qx "${{ inputs.version }}"

      # The formula's own test block, run the way Homebrew runs it.
      - name: brew test
        if: ${{ github.event_name != 'pull_request' }}
        run: brew test allan-nava/pqprobe/pqprobe

      # The binary is the thing, not the install: prove it does the job. No
      # --exit-on, because a WARN out there is not this workflow's business.
      - name: Smoke — it probes a real endpoint
        if: ${{ github.event_name != 'pull_request' }}
        run: pqprobe probe example.com --timeout 20s
