<svg width="760" height="200" viewBox="0 0 760 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="pqprobe">
  <defs>
    <linearGradient id="w-bg" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17274a"/>
      <stop offset="0.55" stop-color="#0e1830"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="w-hello" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.6" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="w-classic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="w-wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#4b5c74"/>
    </linearGradient>
    <style>
      /* rendered as an &lt;img&gt;, so this follows the viewer's OS colour scheme */
      .wm { fill: #0f172a; }
      @media (prefers-color-scheme: dark) { .wm { fill: #f1f5f9; } }
    </style>
  </defs>

  <!-- mark: the 512 plate, scaled to 160 -->
  <g transform="translate(20 20) scale(0.3125)">
    <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#w-bg)"/>
    <rect x="8.75" y="8.75" width="494.5" height="494.5" rx="115.25" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>
    <rect x="412" y="96" width="44" height="320" rx="22" fill="url(#w-wall)" fill-opacity="0.85"/>
    <rect x="56" y="148" width="64" height="56" rx="18" fill="url(#w-classic)"/>
    <path d="M132 176 H404" stroke="url(#w-classic)" stroke-width="26" stroke-linecap="round"/>
    <rect x="56" y="290" width="132" height="92" rx="28" fill="url(#w-hello)"/>
    <path d="M200 336 H298" stroke="url(#w-hello)" stroke-width="34" stroke-linecap="round"/>
    <g fill="#8b5cf6">
      <circle cx="360" cy="336" r="10" fill-opacity="0.34"/>
      <circle cx="382" cy="336" r="8" fill-opacity="0.22"/>
      <circle cx="401" cy="336" r="6" fill-opacity="0.13"/>
    </g>
    <path d="M310 384 L344 288" stroke="#f87171" stroke-width="22" stroke-linecap="round"/>
  </g>

  <!-- wordmark: textLength keeps the lockup the same width on every font stack -->
  <text x="208" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="104" font-weight="700" letter-spacing="-4"
        textLength="512" lengthAdjust="spacingAndGlyphs">
    <tspan fill="#8b5cf6">pq</tspan><tspan class="wm">probe</tspan>
  </text>
</svg>
