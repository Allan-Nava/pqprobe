  <!-- the classical client arrives -->
  <path d="M9 23 H49" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>
  <!-- the post-quantum-capable one does not: no dashes at 16px, they read as noise -->
  <path d="M9 41 H33" stroke="url(#fpq)" stroke-width="9" stroke-linecap="round"/>
  <path d="M38 47 L44 35" stroke="#f87171" stroke-width="5.5" stroke-linecap="round"/>
