<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="pqprobe — which classes of client can still handshake with this endpoint">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e1830"/>
      <stop offset="0.6" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="0.16" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-plate" x1="72" y1="72" x2="248" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17274a"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="og-hello" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.6" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="og-classic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="og-wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#4b5c74"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>

  <g transform="translate(72 64) scale(0.34)">
    <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#og-plate)"/>
    <rect x="8.75" y="8.75" width="494.5" height="494.5" rx="115.25" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>
    <rect x="412" y="96" width="44" height="320" rx="22" fill="url(#og-wall)" fill-opacity="0.85"/>
    <rect x="56" y="148" width="64" height="56" rx="18" fill="url(#og-classic)"/>
    <path d="M132 176 H404" stroke="url(#og-classic)" stroke-width="26" stroke-linecap="round"/>
    <rect x="56" y="290" width="132" height="92" rx="28" fill="url(#og-hello)"/>
    <path d="M200 336 H298" stroke="url(#og-hello)" stroke-width="34" stroke-linecap="round"/>
    <g fill="#8b5cf6">
      <circle cx="360" cy="336" r="10" fill-opacity="0.34"/>
      <circle cx="382" cy="336" r="8" fill-opacity="0.22"/>
      <circle cx="401" cy="336" r="6" fill-opacity="0.13"/>
    </g>
    <path d="M310 384 L344 288" stroke="#f87171" stroke-width="22" stroke-linecap="round"/>
  </g>

  <text x="272" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="92" font-weight="700" letter-spacing="-3">
    <tspan fill="#8b5cf6">pq</tspan><tspan fill="#f1f5f9">probe</tspan>
  </text>
  <text x="276" y="222" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace"
        font-size="24" fill="#93a4bd" letter-spacing="1">one static Go binary · zero dependencies · no requests</text>

  <text x="72" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="42" font-weight="600" fill="#dbe4f0">Which classes of client can still handshake here?</text>

  <!-- the asymmetry, in the shape the tool prints it -->
  <rect x="72" y="368" width="1056" height="186" rx="22" fill="#0d1626" fill-opacity="0.92"
        stroke="#94a3b8" stroke-opacity="0.16"/>
  <g font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="27">
    <text x="104" y="412" fill="#93a4bd">$ pqprobe probe origin.example.com</text>

    <text x="104" y="458" fill="#f87171" font-weight="700">BAD</text>
    <text x="190" y="458" fill="#dbe4f0">origin.example.com:443</text>
    <text x="576" y="458" fill="#a78bfa" font-weight="700">pq-intolerant</text>

    <text x="104" y="500" fill="#fbbf24" font-weight="700">WARN</text>
    <text x="190" y="500" fill="#93a4bd">handshake/pq-preferred</text>
    <text x="576" y="500" fill="#93a4bd">no handshake (reset)</text>

    <text x="104" y="542" fill="#34d399" font-weight="700">OK</text>
    <text x="190" y="542" fill="#93a4bd">handshake/classic</text>
    <text x="576" y="542" fill="#93a4bd">TLS 1.3, X25519</text>
  </g>

  <text x="1128" y="596" text-anchor="end"
        font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace"
        font-size="24" fill="#7de9cf" fill-opacity="0.85">allan-nava.github.io/pqprobe</text>
</svg>
